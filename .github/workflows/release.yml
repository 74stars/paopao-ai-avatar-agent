name: Paopao Formal Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.1.0
        type: string
      publish:
        description: Publish or update the GitHub Release when all gates pass
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      credentials_present: ${{ steps.signing.outputs.credentials_present }}
      version: ${{ steps.metadata.outputs.version }}
      credential_status: ${{ steps.signing.outputs.status }}
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          lfs: false
      - name: Verify annotated tag and version metadata
        id: metadata
        shell: bash
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag" || { echo "::error::Formal releases require an annotated tag"; exit 1; }
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)" || { echo "::error::Checkout does not match tag"; exit 1; }
          node scripts/verify-release.mjs --tag "$RELEASE_TAG"
          echo "version=$(printf '%s' "$RELEASE_TAG" | cut -c2-)" >> "$GITHUB_OUTPUT"
      - name: Evaluate signing credential gate
        id: signing
        shell: bash
        run: |
          missing=()
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            test -n "$(printenv "$name")" || missing+=("$name")
          done
          if test "${#missing[@]}" -eq 0; then
            echo "credentials_present=true" >> "$GITHUB_OUTPUT"
            echo "status=credentials-present" >> "$GITHUB_OUTPUT"
          else
            joined=$(IFS=,; echo "${missing[*]}")
            echo "credentials_present=false" >> "$GITHUB_OUTPUT"
            echo "status=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Formal publication blocked; missing repository secrets: $joined"
            echo "### Formal publication blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing repository secrets: $joined" >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run release:verify -- --tag "$RELEASE_TAG"
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:unit
      - run: npm run rebuild:native:node
      - run: npm run test --workspace=@paopao/infrastructure
      - name: "Feishu adapter integration: adapter"
        run: npx tsx --test --test-concurrency=1 test/adapter.test.ts
        working-directory: adapters/feishu
      - name: "Feishu adapter integration: message"
        run: npx tsx --test --test-concurrency=1 test/message.test.ts
        working-directory: adapters/feishu
      - name: "Feishu adapter integration: reply"
        run: npx tsx --test --test-concurrency=1 test/reply.test.ts
        working-directory: adapters/feishu
      - name: "Feishu adapter integration: SDK transport"
        run: npx tsx --test --test-concurrency=1 test/sdk-transport.test.ts
        working-directory: adapters/feishu
      - run: npm run test:g3
      - run: npm run test:evals
      - run: xvfb-run -a npm run test:e2e:preview
      - run: npm run build
      - run: npm run icons:check --workspace=paopao-desktop
      - name: Verify archived resources are absent from build
        run: |
          test ! -e desktop-app/dist/assets/library-world-v4
          test ! -e desktop-app/dist/assets/library-world-v4-1

  windows-package:
    runs-on: windows-latest
    needs: [policy, verify]
    outputs:
      verified: ${{ steps.verification.outputs.verified }}
    env:
      CREDENTIALS_PRESENT: ${{ needs.policy.outputs.credentials_present }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure Windows signing credentials
        if: ${{ needs.policy.outputs.credentials_present == 'true' }}
        shell: pwsh
        run: |
          "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run Windows Wave 4 E2E
        shell: pwsh
        run: |
          npm run test:e2e 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\wave4-e2e.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Surface Windows E2E failure log
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/wave4-e2e.log"
          if [ -s "$f" ]; then
            msg=$(tail -80 "$f" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%%0A%s", $0}')
            echo "::error title=Windows Wave4 E2E failed::$msg"
          fi
      - run: npm run dist:win
      - run: npm run smoke:preload:runtime
      - name: Verify Authenticode signature
        id: verification
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop-app/release/Paopao-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer not found" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          $lines = @(
            "artifact=$($installer.Name)",
            "status=$($signature.Status)",
            "subject=$($signature.SignerCertificate.Subject)",
            "thumbprint=$($signature.SignerCertificate.Thumbprint)"
          )
          $lines | Set-Content desktop-app/release/SIGNING-VERIFICATION-win.txt
          if ($env:CREDENTIALS_PRESENT -eq "true") {
            if ($signature.Status -ne "Valid") { throw "Expected a valid Authenticode signature, got $($signature.Status)" }
            "verified=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "status=signed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "verified=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "status=unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
      - name: Clean-runner install, launch and uninstall smoke
        shell: pwsh
        run: |
          try {
            $installer = (Get-ChildItem desktop-app/release/Paopao-Setup-*.exe | Select-Object -First 1).FullName
            $installDir = Join-Path $env:RUNNER_TEMP "PaopaoInstall"
            $dataDir = Join-Path $env:RUNNER_TEMP "PaopaoUserData"
            $appPath = Join-Path $installDir "泡泡.exe"
            $launched = $false
            try {
              $install = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
              if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
              if (-not (Test-Path $appPath)) { throw "Expected installed executable not found: $appPath" }
              if ($env:CREDENTIALS_PRESENT -eq "true") {
                $appSignature = Get-AuthenticodeSignature $appPath
                if ($appSignature.Status -ne "Valid") { throw "Installed application signature is $($appSignature.Status)" }
              }
              $process = Start-Process -FilePath $appPath -ArgumentList "--user-data-dir=$dataDir" -PassThru
              Start-Sleep -Seconds 10
              if ($process.HasExited) { throw "Installed application exited during smoke test" }
              if (-not (Test-Path (Join-Path $dataDir "db/paopao.sqlite"))) { throw "Installed application did not create its SQLite readiness marker" }
              $launched = $true
            } finally {
              Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "$installDir*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              $uninstaller = Get-ChildItem $installDir -Recurse -Filter "*ninstall*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($uninstaller) {
                $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
                if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
              }
            }
            Start-Sleep -Seconds 3
            if (-not $launched) { throw "Installed application launch was not verified" }
            if (Test-Path $appPath) { throw "Application executable remains after uninstall" }
            @("installer=$installer", "application=$appPath", "installDir=$installDir", "sqliteReady=pass", "launch=pass", "uninstall=pass", "userDataPreservedByPolicy=true") | Set-Content desktop-app/release/INSTALL-SMOKE-win.txt
          } catch {
            $msg = ($_ | Out-String).Trim() -replace '%', '%25' -replace "`n", '%0A' -replace "`r", ''
            Write-Host "::error title=Windows install smoke failed::$msg"
            throw
          }
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop-app/release/Paopao-Setup-*.exe,desktop-app/release/*.blockmap |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content desktop-app/release/SHA256SUMS-win.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paopao-${{ env.RELEASE_TAG }}-windows-x64-${{ steps.verification.outputs.status }}
          path: |
            desktop-app/release/Paopao-Setup-*.exe
            desktop-app/release/*.blockmap
            desktop-app/release/SHA256SUMS-win.txt
            desktop-app/release/SIGNING-VERIFICATION-win.txt
            desktop-app/release/INSTALL-SMOKE-win.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paopao-${{ env.RELEASE_TAG }}-wave4-windows-x64
          path: test-results/e2e-wave4/
          if-no-files-found: warn

  macos-package:
    runs-on: macos-latest
    needs: [policy, verify]
    outputs:
      verified: ${{ steps.verification.outputs.verified }}
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CREDENTIALS_PRESENT: ${{ needs.policy.outputs.credentials_present }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.policy.outputs.credentials_present }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Configure macOS signing credentials
        if: ${{ needs.policy.outputs.credentials_present == 'true' }}
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect API key
        if: needs.policy.outputs.credentials_present == 'true'
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Run macOS dist
        shell: bash
        run: |
          npm run dist:mac 2>&1 | tee /tmp/dist-mac.log
          exit ${PIPESTATUS[0]}
      - name: Surface macOS dist failure log
        if: failure()
        shell: bash
        run: |
          if [ -s /tmp/dist-mac.log ]; then
            msg=$(tail -80 /tmp/dist-mac.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%%0A%s", $0}')
            echo "::error title=dist:mac failed::$msg"
          fi
      - run: npm run smoke:preload:runtime
      - name: Notarize and staple release DMGs
        if: needs.policy.outputs.credentials_present == 'true'
        shell: bash
        run: |
          for dmg in desktop-app/release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple -v "$dmg"
          done
      - name: Verify every macOS release container
        id: verification
        shell: bash
        run: |
          set -euo pipefail
          report=desktop-app/release/SIGNING-VERIFICATION-mac.txt
          mounted=()
          cleanup_verification() {
            for mount_point in "${mounted[@]}"; do hdiutil detach "$mount_point" >/dev/null 2>&1 || true; done
            rm -rf "$RUNNER_TEMP"/verify-dmg-* "$RUNNER_TEMP"/verify-zip-*
          }
          trap cleanup_verification EXIT
          : > "$report"
          verify_app() {
            app=$1
            artifact=$2
            echo "artifact=$artifact app=$app" | tee -a "$report"
            codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tee -a "$report"
            spctl --assess --type execute --verbose=2 "$app" 2>&1 | tee -a "$report"
            xcrun stapler validate "$app" 2>&1 | tee -a "$report"
            archs=$(lipo -archs "$app/Contents/MacOS/泡泡")
            case "$artifact" in
              *-arm64.*) test "$archs" = arm64 ;;
              *-x64.*) test "$archs" = x86_64 ;;
            esac
          }
          app_count=0
          for app in desktop-app/release/mac*/泡泡.app; do
            test -d "$app" || continue
            app_count=$((app_count + 1))
            if test "$CREDENTIALS_PRESENT" = true; then verify_app "$app" "unpacked-$app"; fi
          done
          test "$app_count" -eq 2
          dmg_count=0
          for dmg in desktop-app/release/*.dmg; do
            dmg_count=$((dmg_count + 1))
            shasum -a 256 "$dmg" | tee -a "$report"
            mount_point="$RUNNER_TEMP/verify-dmg-$dmg_count"
            mkdir -p "$mount_point"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg"
            mounted+=("$mount_point")
            app=$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$app"
            if test "$CREDENTIALS_PRESENT" = true; then
              xcrun stapler validate "$dmg" 2>&1 | tee -a "$report"
              verify_app "$app" "$(basename "$dmg")"
            fi
            hdiutil detach "$mount_point"
            rm -rf "$mount_point"
          done
          test "$dmg_count" -eq 2
          test "$(shasum -a 256 desktop-app/release/*.dmg | awk '{print $1}' | sort -u | wc -l | tr -d ' ')" -eq 2
          zip_count=0
          for archive in desktop-app/release/*.zip; do
            zip_count=$((zip_count + 1))
            shasum -a 256 "$archive" | tee -a "$report"
            extract="$RUNNER_TEMP/verify-zip-$zip_count"
            mkdir -p "$extract"
            ditto -x -k "$archive" "$extract"
            app=$(find "$extract" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$app"
            if test "$CREDENTIALS_PRESENT" = true; then verify_app "$app" "$(basename "$archive")"; fi
            rm -rf "$extract"
          done
          test "$zip_count" -eq 2
          test "$(shasum -a 256 desktop-app/release/*.zip | awk '{print $1}' | sort -u | wc -l | tr -d ' ')" -eq 2
          cleanup_verification
          trap - EXIT
          if test "$CREDENTIALS_PRESENT" = true; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "status=signed" >> "$GITHUB_OUTPUT"
          else
            echo "status=unsigned-candidate" | tee -a "$report"
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "status=unsigned" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean-runner mount, launch and removal smoke
        shell: bash
        run: |
          set -euo pipefail
          app_pid=""
          mounted=false
          mount_point="$RUNNER_TEMP/paopao-dmg"
          install_root="$RUNNER_TEMP/PaopaoApplications"
          cleanup_smoke() {
            if test -n "$app_pid"; then
              kill "$app_pid" >/dev/null 2>&1 || true
              for _ in $(seq 1 30); do kill -0 "$app_pid" 2>/dev/null || break; sleep 1; done
              kill -9 "$app_pid" >/dev/null 2>&1 || true
              wait "$app_pid" >/dev/null 2>&1 || true
              app_pid=""
            fi
            if test "$mounted" = true; then hdiutil detach "$mount_point" >/dev/null 2>&1 || true; fi
            rm -rf "$mount_point" "$install_root"
          }
          trap cleanup_smoke EXIT
          runner_arch=$(uname -m)
          case "$runner_arch" in
            arm64) artifact_arch=arm64 ;;
            x86_64) artifact_arch=x64 ;;
            *) echo "Unsupported runner architecture: $runner_arch"; exit 1 ;;
          esac
          dmg="desktop-app/release/Paopao-${{ needs.policy.outputs.version }}-$artifact_arch.dmg"
          user_data="$RUNNER_TEMP/PaopaoUserData"
          mkdir -p "$mount_point" "$install_root" "$user_data"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg"
          mounted=true
          source_app=$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$source_app"
          cp -R "$source_app" "$install_root/"
          installed_app=$(find "$install_root" -maxdepth 1 -name '*.app' -print -quit)
          executable=$(find "$installed_app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          "$executable" --user-data-dir="$user_data" > "$RUNNER_TEMP/paopao-installed.log" 2>&1 &
          app_pid=$!
          sleep 10
          kill -0 "$app_pid"
          test -e "$user_data/db/paopao.sqlite"
          kill "$app_pid" 2>/dev/null || true
          for _ in $(seq 1 30); do kill -0 "$app_pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          app_pid=""
          rm -rf "$installed_app"
          test ! -e "$installed_app"
          hdiutil detach "$mount_point"
          mounted=false
          printf 'dmg=%s\nmount=pass\nsqliteReady=pass\nlaunch=pass\nremoval=pass\nuserDataPreservedByPolicy=true\n' "$dmg" > desktop-app/release/INSTALL-SMOKE-mac.txt
          cleanup_smoke
          trap - EXIT
      - name: Generate macOS checksums
        run: shasum -a 256 desktop-app/release/*.dmg desktop-app/release/*.zip desktop-app/release/*.blockmap > desktop-app/release/SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paopao-${{ env.RELEASE_TAG }}-macos-x64-arm64-${{ steps.verification.outputs.status }}
          path: |
            desktop-app/release/*.dmg
            desktop-app/release/*.zip
            desktop-app/release/*.blockmap
            desktop-app/release/SHA256SUMS-mac.txt
            desktop-app/release/SIGNING-VERIFICATION-mac.txt
            desktop-app/release/INSTALL-SMOKE-mac.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paopao-${{ env.RELEASE_TAG }}-wave4-macos
          path: test-results/e2e-wave4/
          if-no-files-found: warn

  publish:
    runs-on: ubuntu-latest
    needs: [policy, verify, windows-package, macos-package]
    if: needs.policy.outputs.credentials_present == 'true' && needs.windows-package.outputs.verified == 'true' && needs.macos-package.outputs.verified == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          pattern: paopao-${{ env.RELEASE_TAG }}-*-signed
          path: release-assets
          merge-multiple: true
      - name: Verify platform checksums and generate aggregate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS-win.txt
          sha256sum -c SHA256SUMS-mac.txt
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum | sed 's#  ./#  #' > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq "$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l)"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*
      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            test "$is_draft" = true || { echo "::error::Published releases are immutable; refusing to replace $RELEASE_TAG"; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Paopao $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            test -z "$asset" || gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release upload "$RELEASE_TAG" release-assets/*
          find release-assets -maxdepth 1 -type f -exec basename {} \; | sort > local-assets.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > remote-assets.txt
          diff -u local-assets.txt remote-assets.txt
          gh release edit "$RELEASE_TAG" --title "Paopao $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --draft=false --prerelease=false

  publication-blocked:
    runs-on: ubuntu-latest
    needs: [policy, verify, windows-package, macos-package]
    if: always() && needs.policy.result == 'success' && needs.policy.outputs.credentials_present != 'true'
    steps:
      - name: Block unsigned formal publication
        shell: bash
        run: |
          echo "::error::Unsigned workflow artifacts were retained for diagnosis, but no GitHub Release was created."
          echo "### No formal release was published" >> "$GITHUB_STEP_SUMMARY"
          echo "Add all seven signing/notarization secrets documented in docs/releases/README.md, then rerun this tag." >> "$GITHUB_STEP_SUMMARY"
          exit 1
