name: Paopao MVP CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:unit
      - run: npm run rebuild:native:node
      - run: npm run test --workspace=@paopao/infrastructure
      - name: "Feishu adapter integration: adapter"
        run: npx tsx --test --test-concurrency=1 test/adapter.test.ts
        working-directory: adapters/feishu
      - name: "Feishu adapter integration: message"
        run: npx tsx --test --test-concurrency=1 test/message.test.ts
        working-directory: adapters/feishu
      - name: "Feishu adapter integration: reply"
        run: npx tsx --test --test-concurrency=1 test/reply.test.ts
        working-directory: adapters/feishu
      - name: "Feishu adapter integration: SDK transport"
        run: npx tsx --test --test-concurrency=1 test/sdk-transport.test.ts
        working-directory: adapters/feishu
      - run: npm run test:g3
      - run: npm run test:evals
      - run: xvfb-run -a npm run test:e2e:preview
      - run: npm run build
      - run: xvfb-run -a npm run smoke:preload:runtime

  windows-native-smoke:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Windows Wave 4 E2E
        shell: pwsh
        run: |
          npm run test:e2e 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\wave4-e2e.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Surface Windows E2E failure log
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/wave4-e2e.log"
          if [ -s "$f" ]; then
            msg=$(tail -80 "$f" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%%0A%s", $0}')
            echo "::error title=Windows Wave4 E2E failed::$msg"
          fi
      - run: npm run dist:win
      - run: npm run smoke:preload:runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paopao-wave4-e2e-windows-x64
          path: test-results/e2e-wave4/
          if-no-files-found: error
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop-app/release/Paopao-Setup-*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content desktop-app/release/SHA256SUMS-win.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paopao-windows-x64
          path: |
            desktop-app/release/Paopao-Setup-*.exe
            desktop-app/release/*.blockmap
            desktop-app/release/SHA256SUMS-win.txt
          if-no-files-found: error

  macos-package-smoke:
    runs-on: macos-latest
    needs: checks
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - name: Run macOS dist
        shell: bash
        run: |
          npm run dist:mac 2>&1 | tee /tmp/dist-mac.log
          exit ${PIPESTATUS[0]}
      - name: Surface macOS dist failure log
        if: failure()
        shell: bash
        run: |
          if [ -s /tmp/dist-mac.log ]; then
            msg=$(tail -80 /tmp/dist-mac.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%%0A%s", $0}')
            echo "::error title=dist:mac failed::$msg"
          fi
      - run: npm run smoke:preload:runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paopao-wave4-e2e-macos
          path: test-results/e2e-wave4/
          if-no-files-found: error
      - name: Generate macOS checksums
        run: shasum -a 256 desktop-app/release/*.dmg desktop-app/release/*.zip > desktop-app/release/SHA256SUMS-mac.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paopao-macos-x64-arm64
          path: |
            desktop-app/release/*.dmg
            desktop-app/release/*.zip
            desktop-app/release/*.blockmap
            desktop-app/release/SHA256SUMS-mac.txt
          if-no-files-found: error
